services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ffai
      POSTGRES_PASSWORD: ffai_dev_only
      POSTGRES_DB: ffai
    ports:
      - "5433:5432"
    volumes:
      - ffai_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ffai -d ffai"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ffai_redis:/data

volumes:
  ffai_postgres:
  ffai_redis:
